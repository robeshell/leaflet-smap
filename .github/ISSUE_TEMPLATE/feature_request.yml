name: 功能建议 / Feature request
description: 希望增加或改进的能力 / Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: 包 / Package
      options:
        - smap-leaflet
        - smap-leaflet-vue
        - 示例站或文档 / Demo site or docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / The problem
      description: 你在做什么时遇到了困难？现在是怎么绕过去的？/ What are you trying to do, and how do you work around it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的用法 / Proposed API
      description: 你希望怎么调用，可以写一段示意代码 / How you would like to call it. A code sketch helps
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 考虑过的其他做法，或者已有的 Leaflet 插件 / Other approaches you considered, or existing Leaflet plugins
